# Release de RapidGo 360 - Variante 7 (#22)
#
# Publica un release reproducible: valida que main este verde en el commit exacto
# que se taggea, crea el tag anotado y publica las notas versionadas de
# docs/releases/<version>.md. No hay pasos manuales ni depende de una maquina.
name: Release RapidGo

run-name: Release ${{ inputs.version }} por ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar, con prefijo v (por ejemplo v1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Validar todo sin crear el tag ni el release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validar version y notas
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "::error title=Release rechazado::$1"; exit 1; }

          [ "${GITHUB_REF}" = "refs/heads/main" ] \
            || fail "el release solo se publica desde main, no desde ${GITHUB_REF}"

          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || fail "se espera vMAJOR.MINOR.PATCH, se recibio '${VERSION}'"

          NOTES="docs/releases/${VERSION}.md"
          [ -s "${NOTES}" ] || fail "falta ${NOTES} o esta vacio"

          TITLE="$(sed -n '1s/^# //p' "${NOTES}")"
          [ -n "${TITLE}" ] || fail "${NOTES} tiene que empezar con un titulo '# ...'"

          {
            echo "NOTES=${NOTES}"
            echo "TITLE=${TITLE}"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
          } >> "${GITHUB_ENV}"

          echo "Version ${VERSION} valida: notas ${NOTES}, titulo '${TITLE}'"

      - name: Validar el estado del tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "::error title=Release rechazado::$1"; exit 1; }

          # Un trabajo que se tomo el trabajo de publicar ya puede estar a medias:
          # si el tag existe y apunta a este mismo commit, es un reintento y se continua.
          if [ -z "$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" || true)" ] \
             && [ -n "$(git ls-remote --tags origin "refs/tags/${VERSION}")" ]; then
            git fetch --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}" >/dev/null 2>&1 || true
          fi

          tag_sha="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" || true)"

          if [ -n "${tag_sha}" ]; then
            [ "${tag_sha}" = "${HEAD_SHA}" ] \
              || fail "el tag ${VERSION} ya existe y apunta a ${tag_sha}, no a ${HEAD_SHA}"
            echo "TAG_EXISTS=true" >> "${GITHUB_ENV}"
            echo "El tag ${VERSION} ya existe sobre ${HEAD_SHA}: reintento de un release incompleto"
            exit 0
          fi

          echo "TAG_EXISTS=false" >> "${GITHUB_ENV}"
          echo "El tag ${VERSION} esta libre"

      - name: Validar que main este verde en este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "::error title=Release rechazado::$1"; exit 1; }

          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&per_page=1"
          info="$(gh api "${runs_url}" \
            --jq '[(.workflow_runs[0].id | tostring), .workflow_runs[0].head_sha, .workflow_runs[0].status, (.workflow_runs[0].conclusion // "none")] | join(" ")')"
          [ -n "${info}" ] || fail "no se pudo leer la ultima corrida del CI sobre main"
          read -r run_id run_sha run_status run_conclusion <<< "${info}"

          head_sha="$(git rev-parse HEAD)"

          [ "${run_sha}" = "${head_sha}" ] \
            || fail "el ultimo CI de main es de ${run_sha} y se quiere taggear ${head_sha}: espera la corrida de este commit"
          [ "${run_status}" = "completed" ] \
            || fail "el CI de main esta '${run_status}' en ${run_sha}"
          [ "${run_conclusion}" = "success" ] \
            || fail "el CI de main termino en '${run_conclusion}' en ${run_sha}"

          {
            echo "### CI de main"
            echo ""
            echo "- Commit: \`${run_sha}\`"
            echo "- Corrida: <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}>"
            echo "- Estado: \`${run_status}/${run_conclusion}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "main verde en ${run_sha}"

      - name: Crear tag anotado
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${TAG_EXISTS:-false}" = "true" ]; then
            echo "El tag ${VERSION} ya existe sobre ${HEAD_SHA}: no se recrea"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}: ${TITLE}"
          git push origin "refs/tags/${VERSION}"

          echo "Tag anotado ${VERSION} creado sobre ${HEAD_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publicar release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          url="$(gh release create "${VERSION}" \
            --title "${TITLE}" \
            --notes-file "${NOTES}" \
            --verify-tag)"

          echo "RELEASE_URL=${url}" >> "${GITHUB_ENV}"
          {
            echo "### Release publicado"
            echo ""
            echo "- Tag: \`${VERSION}\` sobre \`${HEAD_SHA}\`"
            echo "- Release: ${url}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Resumen
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice title=Dry run::${VERSION} validado sin crear tag ni release"
            echo "Dry run: ${VERSION} validado. No se creo el tag ni el release." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "Release ${VERSION} publicado: ${RELEASE_URL:-sin URL}" >> "${GITHUB_STEP_SUMMARY}"
